{% extends "base.html" %}

{% block title %}辨識測試{% endblock %}

{% block content %}
  <h1>辨識測試</h1>

  <button type="button" class="btn btn-primary" id="scan-btn">拍照辨識</button>
  <input type="file" id="scan-input" accept="image/*" capture="environment" hidden>

  <div class="scan-canvas-wrap">
    <canvas id="scan-canvas"></canvas>
  </div>

  <ul id="scan-result" class="result-list"></ul>

  <script src="{{ url_for('static', filename='recognize.js') }}"></script>
{% endblock %}
