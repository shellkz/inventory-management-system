{% extends "base.html" %}

{% block title %}新增物品{% endblock %}

{% block content %}
  <h1>新增物品</h1>

  <form
    id="add-item-form"
    class="form"
    hx-post="/items/add"
    hx-encoding="multipart/form-data"
    hx-target="#add-item-result"
    hx-swap="innerHTML"
  >
    <div class="field">
      <label for="name">名稱</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div class="field">
      <label for="category">分類</label>
      <input type="text" id="category" name="category">
    </div>
    <div class="field">
      <label for="min_stock">庫存下限</label>
      <input type="number" id="min_stock" name="min_stock" min="0" value="0">
    </div>

    <section class="photo-widget">
      <h2>參考照片</h2>
      <div id="photo-list" class="photo-grid"></div>
      <button type="button" class="btn btn-secondary" id="add-photo-btn">新增照片</button>
      <input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
      <input type="file" id="images-input" name="images" multiple hidden>
    </section>

    <button type="submit" class="btn btn-primary">新增</button>
  </form>

  <div id="add-item-result"></div>

  <script src="{{ url_for('static', filename='add_item.js') }}"></script>
{% endblock %}
