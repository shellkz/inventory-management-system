{% extends "base.html" %}
{% block title %}物品設定{% endblock %}
{% block content %}
  <div class="field-list">
    <div class="field-row">
      <label for="min_stock">最低庫存</label>
      <input type="number" id="min_stock" name="min_stock" min="0" value="{{ item.min_stock }}">
    </div>
    <button type="button" class="btn btn-primary" id="save-btn" data-item-id="{{ item.id }}">提交</button>
  </div>

  <script src="{{ url_for('items.static', filename='edit/[id]/script.js') }}"></script>
{% endblock %}
