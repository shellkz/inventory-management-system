{% extends "base.html" %}

{% block title %}盤點{% endblock %}

{% block content %}
  <h1>盤點</h1>

  <div class="field-row">
    <label for="target-item-select">要盤點的物品</label>
    <select id="target-item-select">
      <option value="">請選擇物品</option>
    </select>
  </div>

  <button type="button" class="btn btn-primary" id="scan-btn" disabled>拍照掃描</button>
  <input type="file" id="scan-input" accept="image/*" capture="environment" hidden>
  <button type="button" class="btn btn-secondary" id="add-btn" hidden>新增物件</button>
  <p id="recognize-error" class="alert alert--error" hidden></p>

  <div class="scan-canvas-wrap">
    <canvas id="scan-canvas"></canvas>
  </div>

  <ul id="candidate-list" class="candidate-list"></ul>

  <section id="rejected-section" hidden>
    <h2>排除物件</h2>
    <ul id="rejected-list" class="candidate-list"></ul>
  </section>

  <button type="button" class="btn btn-primary" id="submit-btn" hidden>提交</button>
  <p id="submit-error" class="alert alert--error" hidden></p>

  <script src="{{ url_for('stocktake.static', filename='script.js') }}"></script>
{% endblock %}
