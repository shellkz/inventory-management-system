services:
  inventory:
    build: ./inventory
    ports:
      - "5000:5000"
    environment:
      - VISION_SERVICE_URL=${VISION_SERVICE_URL}
      - VISION_API_KEY=${VISION_API_KEY}
    volumes:
      - ./inventory_data:/app/data
      - ./inventory/alembic/versions:/app/alembic/versions
    depends_on:
      - vision-service

  vision-service:
    build: ./vision-service
    environment:
      - FASTSAM_ONNX_PATH=${FASTSAM_ONNX_PATH}
      - DINOV2_ONNX_PATH=${DINOV2_ONNX_PATH}
      - VISION_API_KEY=${VISION_API_KEY}
    volumes:
      - ./models:/app/models
      - ./vision_data:/app/data

  go2rtc:
    image: alexxit/go2rtc
    environment:
      - CAM_USER=${CAM_USER}
      - CAM_PASS=${CAM_PASS}
      - CAM1_IP=${CAM1_IP}
      - CAM_PATH=${CAM_PATH}
    volumes:
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml
